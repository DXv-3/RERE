# CodeWrench emails. Keys and placeholders follow Keycloak 26.7.3 theme/base/email/messages/messages_en.properties.
# {0}.. keep the stock meaning (links, dates, expiry, ...). Where the stock text used the realm name
# placeholder for the product, the name is written out so it never depends on the realm display name.
# No apostrophes: these strings go through MessageFormat, where a single quote must be doubled.

cwEmailFooter=You are receiving this email because of activity on your CodeWrench account.

# Email verification. {0} link, {1} expiry in minutes, {2} realm, {3} expiry with unit
emailVerificationSubject=Verify Your Email
emailVerificationBody=Someone created a CodeWrench account with this email address. If this was you, open the link below to verify your email address.\n\n{0}\n\nThis link expires in {3}.\n\nIf you did not create this account, you can ignore this message.
emailVerificationBodyHtml=<p>Someone created a CodeWrench account with this email address. If this was you, verify your email address to finish setting up.</p><p><a href="{0}">Verify Email</a></p><p>This link expires in {3}.</p><p>If you did not create this account, you can ignore this message.</p>
emailVerificationBodyCode=Enter this code to verify your email address.\n\n{0}\n\nIf you did not ask for this, you can ignore this message.
emailVerificationBodyCodeHtml=<p>Enter this code to verify your email address.</p><p><b>{0}</b></p><p>If you did not ask for this, you can ignore this message.</p>

# Email address change. {0} link, {1} new email, {2} realm, {3} expiry with unit
emailUpdateConfirmationSubject=Confirm Your New Email
emailUpdateConfirmationBody=To change the email address on your CodeWrench account to {1}, open the link below.\n\n{0}\n\nThis link expires in {3}.\n\nIf you do not want this change, you can ignore this message.
emailUpdateConfirmationBodyHtml=<p>To change the email address on your CodeWrench account to <b>{1}</b>, confirm the change below.</p><p><a href="{0}">Confirm New Email</a></p><p>This link expires in {3}.</p><p>If you do not want this change, you can ignore this message.</p>

# SMTP test from the admin console. {0} realm
emailTestSubject=CodeWrench Email Test
emailTestBody=This is a test message from CodeWrench. If you can read it, email is working.
emailTestBodyHtml=<p>This is a test message from CodeWrench. If you can read it, email is working.</p>

# Identity provider link. {0} provider, {1} realm, {2} username at the provider, {3} link, {4} expiry in minutes, {5} expiry with unit
identityProviderLinkSubject=Link Your {0} Account
identityProviderLinkBody=Someone wants to link your CodeWrench account with the {0} account of user {2}. If this was you, open the link below to link the accounts.\n\n{3}\n\nThis link expires in {5}.\n\nIf you did not start this, you can ignore this message. If you link the accounts, you will be able to sign in to CodeWrench through {0}.
identityProviderLinkBodyHtml=<p>Someone wants to link your CodeWrench account with the <b>{0}</b> account of user {2}. If this was you, confirm the link below.</p><p><a href="{3}">Link Accounts</a></p><p>This link expires in {5}.</p><p>If you did not start this, you can ignore this message. If you link the accounts, you will be able to sign in to CodeWrench through {0}.</p>

# Password reset. {0} link, {1} expiry in minutes, {2} realm, {3} expiry with unit
passwordResetSubject=Reset Your Password
passwordResetBody=Someone asked to reset the password on your CodeWrench account. If this was you, open the link below to choose a new one.\n\n{0}\n\nThis link expires in {3}.\n\nIf you did not ask for this, you can ignore this message and nothing will change.
passwordResetBodyHtml=<p>Someone asked to reset the password on your CodeWrench account. If this was you, choose a new password below.</p><p><a href="{0}">Reset Password</a></p><p>This link expires in {3}.</p><p>If you did not ask for this, you can ignore this message and nothing will change.</p>

# Admin-requested account actions. {0} link, {1} expiry in minutes, {2} realm, {3} list of actions, {4} expiry with unit
executeActionsSubject=Update Your CodeWrench Account
executeActionsBody=Your CodeWrench account needs an update: {3}. Open the link below to start.\n\n{0}\n\nThis link expires in {4}.\n\nIf you were not expecting this, you can ignore this message and nothing will change.
executeActionsBodyHtml=<p>Your CodeWrench account needs an update: {3}. Start below.</p><p><a href="{0}">Update Account</a></p><p>This link expires in {4}.</p><p>If you were not expecting this, you can ignore this message and nothing will change.</p>

# Security notices. {0} date, {1} IP address (credential events: {0} credential type, {1} date, {2} IP address)
eventLoginErrorSubject=Sign-In Attempt Failed
eventLoginErrorBody=Someone tried to sign in to your CodeWrench account and failed on {0} from {1}. If this was not you, please contact support.
eventLoginErrorBodyHtml=<p>Someone tried to sign in to your CodeWrench account and failed on {0} from {1}. If this was not you, please contact support.</p>
